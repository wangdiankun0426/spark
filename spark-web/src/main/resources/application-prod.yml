server:
  port: 8000
  tomcat:
    max-swallow-size: 50MB
    relaxed-query-chars: "[,],"
    relaxed-path-chars: "[,],"
spring:
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.ProcessEngineAutoConfiguration
      - org.flowable.spring.boot.ProcessEngineServicesAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.10.0.3:3306/spark?useUnicode=true&characterEncoding=utf8&nullCatalogMeansCurrent=true&serverTimezone=Asia/Shanghai
    username: root
    password: Qaz7410
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      filters: stat,wall,slf4j
      connection-properties: "druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500"
  flowable:
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://172.10.0.3:3306/spark_bpm?useUnicode=true&characterEncoding=utf8&nullCatalogMeansCurrent=true&serverTimezone=Asia/Shanghai
      username: root
      password: Qaz7410
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        filters: stat,wall,slf4j
  data:
    redis:
      host: 172.10.0.2
      port: 6379
      password: Qaz7410
  rabbitmq:
    host: 172.10.0.4
    port: 5672
    username: root
    password: Qaz7410
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  elasticsearch:
    uris: http://172.10.0.6:9203
    username: elastic
    password: Qaz7410
  neo4j:
    uri: bolt://172.10.0.8:7687
    username: neo4j
    password: Qwer7410
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
user:
  avatar:
    path: /opt/spark/docs/avatar/
form:
